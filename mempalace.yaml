# Phase 8.4 D-20 — Project keyword taxonomy for mempalace structured-knowledge palace.
#
# This file documents the room/keyword shape. The actual palace state (drawers,
# vector index) lives at ~/.mempalace/palace/ — populated by `mempalace init`
# (one-time) + `mempalace mine .` (periodic re-index).
#
# Role split (D-20 / RESEARCH §"D-20 Reframing" lines 928-931):
#   claude-mem        = canonical conversation memory (cross-session)
#   mempalace         = structured-knowledge palace (rooms × keywords; user-global)
#   ~/.claude/.../memory/ = Claude internal session auto-memory (orthogonal)
#   chroma_rag/trade_memory = RAG learning loop (separate concern; INFRA-03)
#
# DO NOT re-run `mempalace init` after editing this file — RESEARCH Pitfall 7,
# init overwrites the YAML.
wing: helix
rooms:
